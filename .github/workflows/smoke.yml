name: Distributed job smoke test
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for API, submit and complete job
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:8000"
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as response:
                      if json.load(response)["status"] == "ok":
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("CloudPulse API did not start")
          req = urllib.request.Request(base + "/jobs", data=json.dumps({"task":"uppercase","payload":"hello"}).encode(), headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req, timeout=10) as response:
              job = json.load(response)
          for attempt in range(40):
              with urllib.request.urlopen(base + "/jobs/" + job["id"], timeout=10) as response:
                  status = json.load(response)
              if status["status"] == "completed":
                  assert status["result"] == "HELLO", status
                  print("CloudPulse job smoke test passed")
                  break
              if status["status"] == "failed":
                  raise RuntimeError(str(status))
              time.sleep(2)
          else:
              raise RuntimeError("Job did not finish")
          PY
      - if: always()
        run: docker compose logs --no-color
